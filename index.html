<script>

 t.likuid=S.a.slice(0,7).reduce((s,x)=>s+num(x),0);
 t.inc=S.i.reduce((s,x)=>s+num(x[0])+num(x[1]),0);
 let idx=0;t.grp=OUT.map(g=>{let v=0;g[1].forEach(()=>{v+=num(S.o[idx][0])+num(S.o[idx][1]);idx++});return v});
 t.out=t.grp.reduce((a,b)=>a+b,0);t.di=t.inc-t.out;t.sav=t.grp[0];t.cil=t.grp[6];
 t.exp=t.out-t.sav;
 t.tgb=S.tg.rows.filter(r=>r.done!==false).reduce((s,r)=>s+num(r.amt),0);t.spn=S.sp.rows.reduce((s,r)=>s+num(r.amt),0);
 t.tuj=S.tj.reduce((s,r)=>s+num(r.v),0);return t}
function ratios(t){const L=[];const rl=(n,v,ok,fmt,tip)=>L.push({n,v:fmt(v),ok,tip});
 const mo=t.exp>0?t.likuid/t.exp:0;rl("Dana darurat (aset lancar ÷ pengeluaran bulanan)",mo,mo>=6,x=>x.toFixed(1)+" bulan","Patokan umum: 3–6 bulan pengeluaran");
 const dr=t.aset>0?t.kew/t.aset*100:0;rl("Rasio utang terhadap aset",dr,dr<=50,x=>x.toFixed(0)+"%","Patokan umum: ≤ 50%");
 const ci=t.inc>0?t.cil/t.inc*100:0;rl("Rasio cicilan terhadap penghasilan",ci,ci<=30,x=>x.toFixed(0)+"%","Patokan umum: ≤ 30%");
 const sv=t.inc>0?t.sav/t.inc*100:0;rl("Rasio menabung/investasi",sv,sv>=10,x=>x.toFixed(0)+"%","Patokan umum: ≥ 10%");
 const di=t.inc>0?t.di/t.inc*100:0;rl("Disposable income",di,di>=0,x=>x.toFixed(0)+"%","Sisa setelah semua pengeluaran; harus ≥ 0");return L}
function setStatus(m){$("#st").textContent=m}
function upd(){const t=T();document.querySelectorAll("[data-f]").forEach(e=>{const f=e.dataset.f;let v=f.split(".").reduce((o,k)=>o?.[k],t);e.textContent=R(v)})}
const ni=(p,v,c="n")=>`<input class="${c}" type="number" inputmode="decimal" value="${v||""}" placeholder="0" data-p="${p}">`;
const CAT={out:["Makanan & Minuman","Transportasi","Komunikasi","Belanja","Tagihan & Cicilan","Hiburan","Kesehatan","Pendidikan","Lainnya"],in:["Gaji","Bonus","Komisi / Usaha","Lainnya"]},ALK=["Cash saving","Land / Aset","Komisi TikTok Aff","Emas","Lainnya"];
let ty="out",fm={},dirty=false;
const today=()=>{const d=new Date(),z=x=>String(x).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())},sm0=()=>today().slice(0,7),bln=m=>new Date(m+"-01T00:00:00").toLocaleDateString("id-ID",{month:"long",year:"numeric"});
const opt=(a,v)=>a.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join("");
let sm=sm0();
function viewSp(){const s=S.sp,rs=s.rows.map((r,i)=>({...r,i,type:r.type=="in"?"in":"out"})).filter(r=>(r.d||"").slice(0,7)==sm).sort((a,b)=>(b.d||"").localeCompare(a.d||"")),
 inn=rs.filter(r=>r.type=="in").reduce((a,r)=>a+num(r.amt),0),out=rs.filter(r=>r.type=="out").reduce((a,r)=>a+num(r.amt),0),bud=num(s.bud),pct=bud?Math.min(100,out/bud*100):0,over=out>bud&&bud>0;
 let last="",list=rs.map(r=>{const hd=r.d!=last?`<div class="mut" style="margin:12px 0 2px;font-size:13px">${r.d?new Date(r.d+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"}):"Tanpa tanggal"}</div>`:"";last=r.d;
  return hd+`<div class="row"><span><b>${esc(r.cat||"Lainnya")}</b><br><small>${esc(r.desc||"")}</small></span><b style="color:${r.type=="in"?"var(--ok)":"var(--bad)"}">${r.type=="in"?"+":"−"}${R(r.amt)}</b><button class="btn g" data-del="sp.rows.${r.i}" aria-label="Hapus">✕</button></div>`}).join("")||`<p class="mut">Belum ada transaksi di bulan ini.</p>`;
 return `<div class="card" style="display:flex;justify-content:space-between;align-items:center"><button class="btn g" data-mo="-1">‹</button><b>${bln(sm)}</b><button class="btn g" data-mo="1">›</button></div>
<div class="grid"><div class="kpi"><small>Pemasukan</small><b style="color:var(--ok)">${R(inn)}</b></div><div class="kpi"><small>Pengeluaran</small><b style="color:var(--bad)">${R(out)}</b></div><div class="kpi"><small>Saldo bulan ini</small><b>${R(inn-out)}</b></div></div>
<div class="card" style="margin-top:12px"><h2>Anggaran Bulanan</h2><div class="row" style="border:0"><span>Anggaran / bulan</span>${ni("sp.bud",s.bud)}</div><div class="bar"><i style="width:${pct}%;background:${over?"var(--bad)":"var(--ac)"}"></i></div><small>${bud?(over?"Melebihi anggaran "+R(out-bud):"Sisa anggaran "+R(bud-out)+" ("+pct.toFixed(0)+"% terpakai)"):"Isi anggaran untuk melihat sisa."}</small></div>
<div class="card"><h2>Catat Transaksi</h2><div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn ${ty=="out"?"":"g"}" style="flex:1" data-ty="out">Pengeluaran</button><button class="btn ${ty=="in"?"":"g"}" style="flex:1" data-ty="in">Pemasukan</button></div>
<div style="display:grid;gap:8px"><input class="s" type="number" inputmode="numeric" placeholder="Jumlah (Rp)" value="${fm.amt||""}" data-fm="amt"><select class="s" data-fm="cat">${opt(CAT[ty],fm.cat)}</select><input class="s" placeholder="Keterangan (opsional)" value="${esc(fm.desc||"")}" data-fm="desc"><input class="s" type="date" value="${fm.d||today()}" data-fm="d"><button class="btn" id="sp-save">Simpan ${ty=="out"?"Pengeluaran":"Pemasukan"}</button></div></div>
<div class="card"><h2>Riwayat Transaksi</h2>${list}</div>`}
function viewTg(){const g=S.tg,rs=g.rows.map((r,i)=>({...r,i})).filter(r=>r.done!==false).sort((a,b)=>(b.d||"").localeCompare(a.d||"")),got=rs.reduce((a,r)=>a+num(r.amt),0),goal=num(g.goal),sisa=Math.max(0,goal-got),p=goal?Math.min(100,got/goal*100):0;
 let tip="";if(g.end&&sisa>0){const n=new Date(),e=g.end.split("-"),m=Math.max(1,(+e[0]-n.getFullYear())*12+(+e[1]-1-n.getMonth())+1);tip=`Agar tercapai di ${bln(g.end)}, sisihkan sekitar <b>${R(sisa/m)}</b> per bulan (${m} bulan lagi).`}
 return `<div class="card"><h2>Sudah tercapai</h2><div style="text-align:center;margin:6px 0 12px"><div style="font-size:30px;font-weight:700;color:var(--ac)">${Math.round(p)}%</div><div class="bar"><i style="width:${p}%"></i></div></div><div class="grid"><div class="kpi"><small>Terkumpul</small><b>${R(got)}</b></div><div class="kpi"><small>Sisa menuju goal</small><b>${R(sisa)}</b></div></div>${tip?`<p style="margin:10px 0 0">${tip}</p>`:""}</div>
<div class="card"><h2>Target Saya</h2><div class="row"><span>Goal (Rp)</span>${ni("tg.goal",g.goal)}</div><div class="row"><span>Mulai</span><input type="month" value="${g.start}" data-p="tg.start" data-t="1"></div><div class="row"><span>Target selesai</span><input type="month" value="${g.end}" data-p="tg.end" data-t="1"></div></div>
<div class="card"><h2>Tambah Setoran</h2><div style="display:grid;gap:8px"><input class="s" type="number" inputmode="numeric" placeholder="Nominal (Rp)" value="${fm.tamt||""}" data-fm="tamt"><select class="s" data-fm="tal">${opt(ALK,fm.tal)}</select><input class="s" type="date" value="${fm.td||today()}" data-fm="td"><button class="btn" id="tg-save">Simpan Setoran</button></div></div>
<div class="card"><h2>Riwayat Setoran</h2>${rs.map(r=>`<div class="row"><span><b>${esc(r.al||"Lainnya")}</b><br><small>${r.d?new Date(r.d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}):"Tanpa tanggal"}</small></span><b style="color:var(--ok)">+${R(r.amt)}</b><button class="btn g" data-del="tg.rows.${r.i}" aria-label="Hapus">✕</button></div>`).join("")||`<p class="mut">Belum ada setoran. Mulai dari yang kecil!</p>`}</div>`}
document.addEventListener("input",e=>{const k=e.target.dataset.fm;if(k)fm[k]=e.target.value});
document.addEventListener("click",e=>{const b=e.target;
 if(b.dataset.ty){ty=b.dataset.ty;fm.cat="";view()}
 if(b.dataset.mo){const d=new Date(sm+"-01T00:00:00");d.setMonth(d.getMonth()+ +b.dataset.mo);sm=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");view()}
 if(b.id=="sp-save"){const a=num(fm.amt);if(a<=0){setStatus("Isi jumlah dulu");return}const d=fm.d||today();S.sp.rows.push({d,type:ty,cat:fm.cat||CAT[ty][0],desc:fm.desc||"",amt:a});sm=d.slice(0,7);fm.amt=fm.desc="";save();view()}
 if(b.id=="tg-save"){const a=num(fm.tamt);if(a<=0){setStatus("Isi nominal dulu");return}S.tg.rows.push({d:fm.td||today(),amt:a,al:fm.tal||ALK[0],done:true});fm.tamt="";save();view()}});
const pr=(p,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%;${c?"background:"+c:""}"></i></div>`;
const tjDone=r=>r.done?num(r.v):Math.min(num(r.s),num(r.v)||num(r.s));
function viewTj(){const L=S.tj.map((r,i)=>({...r,i})),tv=L.reduce((a,r)=>a+num(r.v),0),ts=L.reduce((a,r)=>a+tjDone(r),0),nd=L.filter(r=>r.done).length;
 return `<div class="grid"><div class="kpi"><small>Tujuan tercapai</small><b>${nd} / ${L.length}</b></div><div class="kpi"><small>Total target</small><b>${R(tv)}</b></div><div class="kpi"><small>Sudah terkumpul</small><b>${R(ts)}</b></div></div>
<div class="card" style="margin-top:12px"><h2>Tambah Tujuan</h2><div style="display:grid;gap:8px"><input class="s" placeholder="Nama tujuan (mis. Umroh, Beli mobil)" value="${esc(fm.jn||"")}" data-fm="jn"><input class="s" type="number" inputmode="numeric" placeholder="Target tahun (mis. 2028)" value="${fm.jt||""}" data-fm="jt"><input class="s" type="number" inputmode="numeric" placeholder="Biaya yang dibutuhkan (Rp)" value="${fm.jv||""}" data-fm="jv"><input class="s" type="number" inputmode="numeric" placeholder="Sudah terkumpul (Rp, opsional)" value="${fm.js||""}" data-fm="js"><button class="btn" id="tj-save">Simpan Tujuan</button></div></div>
${L.map((r,k)=>{const p=r.done?100:num(r.v)?Math.min(100,num(r.s)/num(r.v)*100):0;return `<div class="card"><div class="row" style="border:0;padding:0"><span><b>${k+1}. ${esc(r.n||"Tanpa nama")}</b><br><small>Target ${esc(r.t||"-")}</small></span><button class="btn g" data-del="tj.${r.i}" aria-label="Hapus">✕</button></div>${pr(p,r.done?"var(--ok)":"")}<div class="row"><span>Biaya dibutuhkan</span>${ni("tj."+r.i+".v",r.v)}</div><div class="row"><span>Sudah terkumpul</span>${ni("tj."+r.i+".s",r.done?r.v:r.s)}</div><label class="row" style="border:0"><input type="checkbox" ${r.done?"checked":""} data-p="tj.${r.i}.done" data-c="1"><span>Sudah tercapai</span><small>${p.toFixed(0)}%</small></label></div>`}).join("")||`<div class="card"><p class="mut">Belum ada tujuan. Tambahkan tujuan pertama Anda di atas.</p></div>`}`}

async function load(){hideAuth();setStatus("Memuat…");const{data,error}=await sb.from("finance_data").select("data").eq("user_id",user.id).maybeSingle();
 if(error){loaded=false;setStatus("Gagal memuat data. Muat ulang halaman.");return}
 S=Object.assign(JSON.parse(S0),(data&&data.data)||{});loaded=true;tab="dash";$("#who").textContent=user.email;setStatus("Tersinkron "+jam());nav();view()}
(()=>{nav();
 if(!window.supabase&&!SUPABASE_URL.startsWith("ISI_")){$("#auth").style.display="block";$("#ab").innerHTML=`<div class="card"><h2>Tidak ada koneksi</h2><p>Aplikasi butuh internet untuk masuk dan memuat data. Periksa koneksi lalu muat ulang.</p></div>`;return}
 if(SUPABASE_URL.startsWith("ISI_")||!window.supabase){$("#auth").style.display="block";$("#ab").innerHTML=`<div class="card"><h2>Konfigurasi belum diisi</h2><p>Buka file index.html, isi SUPABASE_URL dan SUPABASE_KEY dengan data dari proyek Supabase Anda (lihat PANDUAN.md).</p></div>`;return}
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);authView("login");$("#auth").style.display="none";
 sb.auth.onAuthStateChange((ev,ses)=>{if(ev=="PASSWORD_RECOVERY"){recov=true;authView("reset");return}
  if(ses&&ses.user){if(!recov&&(!user||user.id!==ses.user.id)){user=ses.user;setTimeout(load,0)}}
  else if(ev=="SIGNED_OUT"||ev=="INITIAL_SESSION"){user=null;loaded=false;authView("login")}})})();
